                properties:
                  status:
                    type: string
                    description: 'processing: o arquivo chega pelo webhook REPORT_EXPORTED.'
                  reportId:
                    type: string
              example:
                status: processing
                reportId: 6612a7f3a19b467000000000
        '400':
