          description: 'URL chamada quando o documento terminar de processar.'
        typeHint:
          type: string
          enum:
            - CONTRATO_SOCIAL
            - ALTERACAO_CONTRATUAL
            - ESTATUTO_SOCIAL
            - REQUERIMENTO_EMPRESARIO
            - PROCURACAO_PJ
            - IRPJ_ECF
            - DECLARACAO_FATURAMENTO
            - CERTIDAO_JUNTA
            - ATA_ASSEMBLEIA
            - DOC_IDENTIDADE
            - COMPROVANTE_RESIDENCIA
            - DIRPF
            - COMPROVANTE_RENDA
            - CERTIDAO_PF
            - PROCURACAO_PF
            - FORA_DE_ESCOPO
            - NAO_IDENTIFICADO
            - CERTIDAO_PGFN_PJ
            - CERTIDAO_FGTS
            - CADIN_FEDERAL
            - CADIN_ESTADUAL
            - CERTIDAO_QSA
            - CERTIFICADO_SIMPLES_NACIONAL
            - ESOCIAL_PJ
            - COMPROVACAO_ESTADO_CIVIL
            - DEMONSTRACOES_FINANCEIRAS
            - EXTRATO_BANCARIO
          description: 'Afirma o tipo documental do arquivo: o pipeline ADOTA este tipo e PULA a etapa de classificação. Use quando a origem do arquivo já garante o tipo (o operador escolheu na tela, o formulário só aceita aquele documento). Como a classificação não roda, não existe leitura automática a confrontar e a verificação EXPECTED_TYPE_MATCH sai SKIP. Não use typeHint para dizer "eu pedi este documento": para isso existe o expectedType.'
        expectedType:
          type: string
          enum:
            - CONTRATO_SOCIAL
            - ALTERACAO_CONTRATUAL
            - ESTATUTO_SOCIAL
            - REQUERIMENTO_EMPRESARIO
            - PROCURACAO_PJ
            - IRPJ_ECF
            - DECLARACAO_FATURAMENTO
            - CERTIDAO_JUNTA
            - ATA_ASSEMBLEIA
            - DOC_IDENTIDADE
            - COMPROVANTE_RESIDENCIA
            - DIRPF
            - COMPROVANTE_RENDA
            - CERTIDAO_PF
            - PROCURACAO_PF
            - FORA_DE_ESCOPO
            - NAO_IDENTIFICADO
            - CERTIDAO_PGFN_PJ
            - CERTIDAO_FGTS
            - CADIN_FEDERAL
            - CADIN_ESTADUAL
            - CERTIDAO_QSA
            - CERTIFICADO_SIMPLES_NACIONAL
            - ESOCIAL_PJ
            - COMPROVACAO_ESTADO_CIVIL
            - DEMONSTRACOES_FINANCEIRAS
            - EXTRATO_BANCARIO
          description: 'Tipo documental que a solicitação PEDIU. Não força nada e não pula etapa alguma: a classificação roda normalmente e o tipo lido é confrontado com este valor na verificação EXPECTED_TYPE_MATCH. Tipo lido igual ao pedido, a verificação passa; diferente, reprova o documento (ou vira ressalva quando a leitura do tipo está com pouca confiança). É o campo que pega o arquivo legítimo enviado no campo errado (uma declaração de IR subida como comprovante de residência), que sem ele seria classificado, validado e aprovado como o tipo que de fato é. Omitir significa envio livre no dossiê: sem pedido, a verificação sai SKIP. Combinado com typeHint no mesmo envio, o typeHint vence e a verificação sai SKIP (não há classificação a confrontar).'
    ReprocessRegistryDocumentDto:
      type: object
      properties:
        forceType:
          type: string
          enum:
            - CONTRATO_SOCIAL
            - ALTERACAO_CONTRATUAL
            - ESTATUTO_SOCIAL
            - REQUERIMENTO_EMPRESARIO
            - PROCURACAO_PJ
            - IRPJ_ECF
            - DECLARACAO_FATURAMENTO
            - CERTIDAO_JUNTA
            - ATA_ASSEMBLEIA
            - DOC_IDENTIDADE
            - COMPROVANTE_RESIDENCIA
            - DIRPF
            - COMPROVANTE_RENDA
            - CERTIDAO_PF
            - PROCURACAO_PF
            - FORA_DE_ESCOPO
            - NAO_IDENTIFICADO
            - CERTIDAO_PGFN_PJ
            - CERTIDAO_FGTS
            - CADIN_FEDERAL
            - CADIN_ESTADUAL
            - CERTIDAO_QSA
            - CERTIFICADO_SIMPLES_NACIONAL
            - ESOCIAL_PJ
            - COMPROVACAO_ESTADO_CIVIL
            - DEMONSTRACOES_FINANCEIRAS
            - EXTRATO_BANCARIO
          description: 'Força o tipo documental (corrige uma classificação errada) e, com isso, dispensa a etapa de classificação.'
        stages:
          type: array
          example:
            - VALIDATE
          description: 'Etapas a reexecutar. Omitir significa reprocessar tudo (classificar, extrair e validar). Cada etapa de fora da lista é pulada e o resultado da tentativa anterior é reaproveitado, o que aparece no resultado do documento em stages.reused. Pular EXTRACT exige tentativa anterior com extração gravada: sem ela a etapa roda normalmente, nunca devolvendo resultado vazio. Reexecutar EXTRACT força a revalidação mesmo que VALIDATE não esteja na lista: parecer antigo sobre extração nova seria mentira.'
          items:
            type: string
            enum:
              - CLASSIFY
              - EXTRACT
              - VALIDATE
        callbackUrl:
          type: string
          description: Webhook chamado quando o reprocessamento terminar.
        overrideFeedback:
          type: boolean
          description: 'Confirma a substituição da decisão que um operador já tomou sobre o parecer. Sem ela, documento já decidido recusa o reprocessamento com 409: a decisão humana não pode ser apagada em silêncio pelo parecer da tentativa nova.'
