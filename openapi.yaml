openapi: 3.0.0
info:
  title: GYRA+ API - MCP Server
  description: API da Gyra+ para analise de credito. Spec curada para uso com agentes AI via MCP.
  version: '1.0'
  contact: {}
servers:
  - url: 'https://gyra-core.gyramais.com.br'
    description: Producao
paths:
  /auth/authenticate:
    post:
      operationId: AuthController_generateAccessToken
      parameters:
        - name: gyra-client-secret
          in: header
          description: 'Client Secret da integracao. Obtido no painel Toolbox em Configuracoes > Integracao.'
          schema:
            type: string
        - name: gyra-client-id
          in: header
          description: 'Client ID da integracao. Obtido no painel Toolbox em Configuracoes > Integracao.'
          schema:
            type: string
      responses:
        '200':
          description: Objeto com accessToken (JWT) e expiresIn (tempo em segundos).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  accessToken:
                    type: string
                    description: 'JWT. Vai no header Authorization como `Bearer <token>`.'
                  expiresAt:
                    type: string
                    format: date-time
                    description: Validade de 24 horas. Renove antes de expirar.
                  userId:
                    type: string
                  organizationId:
                    type: string
                  loggedOutAt:
                    type: string
                    nullable: true
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: 6612a7f3a1b2c3d400000000
                createdAt: '2026-07-31T13:40:02.118Z'
                updatedAt: '2026-07-31T13:40:02.118Z'
                expiresAt: '2026-08-01T13:40:02.114Z'
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                userId: 6612a7f3b4c5d6e700000000
                loggedOutAt: null
                organizationId: 6612a7f30000000000000001
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Erro interno do servidor.
      tags:
        - auth
      summary: Gerar token de acesso JWT
      description: |
          Autentica via client credentials (client-id e client-secret) e retorna um JWT.
          
          Este e o primeiro passo para usar a API. O token retornado deve ser enviado
          no header Authorization de todas as requisicoes subsequentes.
          
          NOTA: No MCP server, a autenticacao e automatica, e este tool e exposto apenas
          para uso manual ou debug. O server gerencia o token internamente.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request POST 'https://gyra-core.gyramais.com.br/auth/authenticate' \
                --header 'gyra-client-id: SEU_CLIENT_ID' \
                --header 'gyra-client-secret: SEU_CLIENT_SECRET'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/auth/authenticate", {
                method: "POST",
                headers: {
                  "gyra-client-id": process.env.GYRA_CLIENT_ID,
                  "gyra-client-secret": process.env.GYRA_CLIENT_SECRET,
                },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.post(
                  "https://gyra-core.gyramais.com.br/auth/authenticate",
                  headers={
                      "gyra-client-id": client_id,
                      "gyra-client-secret": client_secret,
                  },
              )
              
              dados = resposta.json()
  /webhook:
    post:
      operationId: WebhookController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookDto'
            example:
              type: REPORT_FINISHED
              url: 'https://api.suaempresa.com/gyra/webhook'
      responses:
        '200':
          description: 'Webhook criado com id, type, url e organizationId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                  apiKey:
                    type: string
                    nullable: true
                  organizationId:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
              example:
                id: 6612a7f344eb43f000000000
                createdAt: '2026-07-31T13:40:02.118Z'
                updatedAt: '2026-07-31T13:40:02.118Z'
                organizationId: 6612a7f3fa9e086b00000000
                type: REPORT_FINISHED
                url: 'https://api.suaempresa.com/gyra/webhook'
                apiKey: null
        '400':
          description: 'Corpo ou parametro invalido. A mensagem aponta o campo, e concatena todas as falhas por virgula.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'document should not be empty,type must be one of the following values: cpf, cnpj'
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para executar esta ação.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Erro interno do servidor.
      tags:
        - webhook
      summary: Criar webhook para notificacoes
      description: |
          Registra uma URL de webhook para receber notificacoes em tempo real.
          
          Tipos de webhook disponiveis:
          - REPORT: notificado quando um relatorio muda de status (PENDING → APPROVED/DENIED/ALERT)
          - REPORT_FINISHED: notificado quando o processamento do relatorio finaliza
          - REPORT_STATUS: notificado em cada mudanca de status intermediaria
          - CREDIT_POLICY: notificado quando a politica de credito e avaliada
          - OPTIN: notificado quando um opt-in e processado
          
          O webhook recebe um POST na URL configurada com o payload do evento.
          Se apiKey for informada, sera enviada no header api-key da requisicao.
          
          RECOMENDADO: Sempre configure um webhook ao criar relatorios. Evita
          a necessidade de polling com get_report.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request POST 'https://gyra-core.gyramais.com.br/webhook' \
                --header 'Authorization: Bearer <token>' \
                --header 'Content-Type: application/json' \
                --data '{"type":"REPORT_FINISHED","url":"https://api.suaempresa.com/gyra/webhook"}'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/webhook", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  "type": "REPORT_FINISHED",
                  "url": "https://api.suaempresa.com/gyra/webhook"
                }),
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.post(
                  "https://gyra-core.gyramais.com.br/webhook",
                  headers={"Authorization": f"Bearer {token}"},
                  json={
                      "type": "REPORT_FINISHED",
                      "url": "https://api.suaempresa.com/gyra/webhook"
                  },
              )
              
              dados = resposta.json()
  /webhook/findBy:
    get:
      operationId: WebhookController_find
      parameters:
        - name: webhookId
          required: false
          in: query
          description: 'ID do webhook especifico (opcional). Sem este parametro, retorna todos.'
          schema:
            example: 664b63037707171ba58cf311
            type: string
      responses:
        '200':
          description: 'Webhook(s) com id, type, url, apiKey e organizationId.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  description: Um webhook de relatorio e credito.
              example:
                - id: 6612a7f344eb43f000000000
                  createdAt: '2026-06-18T23:48:24.706Z'
                  updatedAt: '2026-06-18T23:48:24.706Z'
                  organizationId: 6612a7f3fa9e086b00000000
                  type: REPORT_FINISHED
                  url: 'https://api.suaempresa.com/gyra/webhook'
                  apiKey: null
        '400':
          description: 'Corpo ou parametro invalido. A mensagem aponta o campo, e concatena todas as falhas por virgula.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'document should not be empty,type must be one of the following values: cpf, cnpj'
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para executar esta ação.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Erro interno do servidor.
      tags:
        - webhook
      summary: Consultar webhooks cadastrados
      description: |
          Busca webhooks cadastrados na organizacao.
          
          Se webhookId for informado, retorna o webhook especifico.
          Caso contrario, retorna todos os webhooks da organizacao autenticada.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request GET 'https://gyra-core.gyramais.com.br/webhook/findBy' \
                --header 'Authorization: Bearer <token>'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/webhook/findBy", {
                method: "GET",
                headers: { Authorization: `Bearer ${token}` },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.get(
                  "https://gyra-core.gyramais.com.br/webhook/findBy",
                  headers={"Authorization": f"Bearer {token}"},
              )
              
              dados = resposta.json()
  /webhook/{id}:
    delete:
      operationId: WebhookController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: ID do webhook a remover.
          schema:
            example: 664b63037707171ba58cf311
            type: string
      responses:
        '200':
          description: Confirmacao de remocao.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
              example:
                id: 6612a7f344eb43f000000000
        '400':
          description: 'Corpo ou parametro invalido. A mensagem aponta o campo, e concatena todas as falhas por virgula.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'document should not be empty,type must be one of the following values: cpf, cnpj'
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para executar esta ação.
        '404':
          description: 'Recurso inexistente OU capacidade nao liberada para a organizacao. As duas coisas respondem 404 de proposito: para quem nao tem o modulo, a rota nao existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 404
                message: Cadastro não encontrado.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Erro interno do servidor.
      tags:
        - webhook
      summary: Deletar webhook
      description: Remove um webhook cadastrado. A URL deixa de receber notificacoes imediatamente.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request DELETE 'https://gyra-core.gyramais.com.br/webhook/6612a7f30000000000000001' \
                --header 'Authorization: Bearer <token>'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/webhook/6612a7f30000000000000001", {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.delete(
                  "https://gyra-core.gyramais.com.br/webhook/6612a7f30000000000000001",
                  headers={"Authorization": f"Bearer {token}"},
              )
              
              dados = resposta.json()
  /report/section/{id}:
    get:
      operationId: SectionController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: 'ID da secao (ObjectId). Disponivel no array sections[] do relatorio.'
      responses:
        '200':
          description: 'Secao completa com dados detalhados, status de finalizacao e metadados.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: A secao por id. Mesma forma da consulta por tipo.
              example:
                id: 6612a7f3dc5b830500000000
                type:
                  id: 6612a7f3ae223a4700000000
                  value: PROTESTS
                sectionDetails:
                  - values:
                      bureau:
                        protestsQuantity: 15
        '400':
          description: 'Corpo ou parametro invalido. A mensagem aponta o campo, e concatena todas as falhas por virgula.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'document should not be empty,type must be one of the following values: cpf, cnpj'
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para executar esta ação.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Erro interno do servidor.
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar secao por ID
      description: |
          Retorna os dados detalhados de uma secao especifica de um relatorio.
          
          Cada relatorio e composto por varias secoes que contem dados de diferentes fontes:
          - Informacoes basicas (CNPJ/CPF, endereco, socios, QSA)
          - Processos judiciais
          - Protestos em cartorio
          - Dividas Pefin/Refin
          - Dados SCR / Open Finance (Banco Central)
          - PEP e sancoes internacionais
          - Resultado da politica de credito
          
          Use get_report para obter a lista de secoes e seus IDs.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request GET 'https://gyra-core.gyramais.com.br/report/section/6612a7f30000000000000001' \
                --header 'Authorization: Bearer <token>'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/report/section/6612a7f30000000000000001", {
                method: "GET",
                headers: { Authorization: `Bearer ${token}` },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.get(
                  "https://gyra-core.gyramais.com.br/report/section/6612a7f30000000000000001",
                  headers={"Authorization": f"Bearer {token}"},
              )
              
              dados = resposta.json()
  /report:
    post:
      operationId: ReportController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportDto'
            example:
              policyId: 6612a7f3625ea4ab00000000
              document: 11.444.777/0001-61
              type: cnpj
      responses:
        '200':
          description: 'Objeto do relatorio com id, status (PENDING), document, type e createdAt.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: O relatorio recem-criado (API v1).
              example:
                id: 6612a7f3a19b467000000000
                document: '43591367000130'
                organizationId: 6612a7f3fa9e086b00000000
                status:
                  id: 6612a7f33fdd7d9400000000
                  value: PENDING
                createdAt: '2026-07-31T13:42:37.059Z'
        '400':
          description: 'Corpo ou parametro invalido. A mensagem aponta o campo, e concatena todas as falhas por virgula.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'document should not be empty,type must be one of the following values: cpf, cnpj'
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para executar esta ação.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Erro interno do servidor.
      tags:
        - report
      security:
        - authorization: []
      summary: Criar relatorio (padrao de integracao com webhook)
      description: |
          PADRAO DE INTEGRACAO, use quando voce esta ajudando um desenvolvedor a
          implementar integracao programatica com webhook. Para um usuario apenas
          gerando relatorio no chat, use create_report_and_wait.
          
          Cria um novo relatorio de analise de credito para um CPF ou CNPJ.
          
          O processamento e ASSINCRONO: voce recebe o reportId imediatamente com
          status PENDING. O cliente acompanha o ciclo via:
            1. Webhook configurado (create_webhook), recomendado para integracoes.
            2. Polling em get_report ate reportProgress.isFinalized === true.
          
          Status (apos analyze_report manual): PENDING → APPROVED, DENIED ou ALERT.
          A maioria dos clientes deixa em PENDING e usa o resultado da politica.
          
          O tipo de relatorio (SIMPLES, ESSENCIAL, COMPLETO, COMPLETO+) e determinado
          pela politica de credito (policyId) utilizada.
          
          Use list_policies (ou find_policy_by_name pra fluxo interativo) para obter
          os policyIds disponiveis na organizacao.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request POST 'https://gyra-core.gyramais.com.br/report' \
                --header 'Authorization: Bearer <token>' \
                --header 'Content-Type: application/json' \
                --data '{"policyId":"6612a7f3625ea4ab00000000","document":"11.444.777/0001-61","type":"cnpj"}'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/report", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  "policyId": "6612a7f3625ea4ab00000000",
                  "document": "11.444.777/0001-61",
                  "type": "cnpj"
                }),
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.post(
                  "https://gyra-core.gyramais.com.br/report",
                  headers={"Authorization": f"Bearer {token}"},
                  json={
                      "policyId": "6612a7f3625ea4ab00000000",
                      "document": "11.444.777/0001-61",
                      "type": "cnpj"
                  },
              )
              
              dados = resposta.json()
  /report/list:
    get:
      operationId: ReportController_list
      parameters:
        - name: take
          in: query
          required: false
          schema:
            type: integer
          description: Quantidade maxima de registros.
        - name: skip
          in: query
          required: false
          schema:
            type: integer
          description: Offset de paginacao.
        - name: statusValue
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - DENIED
              - ALERT
          description: Status do relatorio.
        - name: document
          in: query
          required: false
          schema:
            type: string
          description: CPF ou CNPJ (apenas numeros).
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: ID do usuario criador.
        - name: createdAtBetween
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: 'Intervalo [startISO, endISO].'
        - name: productIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filtrar por productIds.
        - name: operationResultId
          in: query
          required: false
          schema:
            type: string
          description: ID do resultado de operacao.
        - name: reportIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: IDs especificos de relatorios.
        - name: batchId
          in: query
          required: false
          schema:
