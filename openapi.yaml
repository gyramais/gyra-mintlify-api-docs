openapi: 3.0.0
info:
  title: GYRA+ API - MCP Server
  description: API da Gyra+ para analise de credito. Spec curada para uso com agentes AI via MCP.
  version: 1.0
  contact: {}
servers: []
paths:
  /auth/authenticate:
    post:
      operationId: AuthController_generateAccessToken
      parameters:
        - name: gyra-client-secret
          in: header
          description: 'Client Secret da integracao. Obtido no painel Toolbox em Configuracoes > Integracao.'
          schema:
            type: string
        - name: gyra-client-id
          in: header
          description: 'Client ID da integracao. Obtido no painel Toolbox em Configuracoes > Integracao.'
          schema:
            type: string
      responses:
        200:
          description: Objeto Session com accessToken (JWT), expiresAt (24h), userId e organizationId.
      tags:
        - auth
      summary: Gerar token de acesso JWT
      description: |
          Autentica via client credentials (client-id e client-secret) e retorna um JWT.
          
          Este e o primeiro passo para usar a API. O token retornado deve ser enviado
          no header Authorization de todas as requisicoes subsequentes.
          
          NOTA: No MCP server, a autenticacao e automatica — este tool e exposto apenas
          para uso manual ou debug. O server gerencia o token internamente.
  /webhook:
    post:
      operationId: WebhookController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookDto'
      responses:
        200:
          description: 'Webhook criado com id, type, url e organizationId.'
      tags:
        - webhook
      summary: Criar webhook para notificacoes
      description: |
          Registra uma URL de webhook para receber notificacoes em tempo real.
          
          Tipos de webhook disponiveis (um tipo por webhook, registre varios se precisar):
          - REPORT: disparado a cada secao do relatorio concluida durante o processamento (granular)
          - REPORT_FINISHED: disparado quando o processamento do relatorio finaliza completamente
          - REPORT_STATUS: disparado quando um analista aprova ou rejeita o relatorio manualmente
          - REPORT_EXPORTED: disparado quando a exportacao (PDF/XLS) de um relatorio e gerada (ou falha)
          - CREDIT_POLICY: disparado quando a politica de credito e avaliada e o status muda
          - COMMITTEE_FINISHED: disparado quando o Comite de Credito IA conclui (ou falha) a deliberacao do relatorio
          - OPERATION: disparado quando uma operacao (fluxo multi-relatorio) conclui

          O webhook recebe um POST na URL configurada com o payload do evento.
          Se apiKey for informada, sera enviada no header api-key da requisicao.

          ATENCAO: os webhooks da organizacao sao copiados para o relatorio na criacao dele.
          Um tipo registrado depois nao dispara para relatorios que ja existiam.
          
          RECOMENDADO: Sempre configure um webhook ao criar relatorios. Evita
          a necessidade de polling com get_report.
  /webhook/findBy:
    get:
      operationId: WebhookController_find
      parameters:
        - name: webhookId
          required: false
          in: query
          description: 'ID do webhook especifico (opcional). Sem este parametro, retorna todos.'
          example: 664b63037707171ba58cf311
          schema:
            type: string
      responses:
        200:
          description: 'Webhook(s) com id, type, url, apiKey e organizationId.'
      tags:
        - webhook
      summary: Consultar webhooks cadastrados
      description: |
          Busca webhooks cadastrados na organizacao.
          
          Se webhookId for informado, retorna o webhook especifico.
          Caso contrario, retorna todos os webhooks da organizacao autenticada.
  /webhook/{id}:
    delete:
      operationId: WebhookController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: ID do webhook a remover.
          example: 664b63037707171ba58cf311
          schema:
            type: string
      responses:
        200:
          description: Confirmacao de remocao.
      tags:
        - webhook
      summary: Deletar webhook
      description: Remove um webhook cadastrado. A URL deixa de receber notificacoes imediatamente.
  /report/section/{id}:
    get:
      operationId: SectionController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: 'ID da secao (ObjectId). Disponivel no array sections[] do relatorio.'
      responses:
        200:
          description: 'Secao completa com dados detalhados, status de finalizacao e metadados.'
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar secao por ID
      description: |
          Retorna os dados detalhados de uma secao especifica de um relatorio.
          
          Cada relatorio e composto por varias secoes que contem dados de diferentes fontes:
          - Informacoes basicas (CNPJ/CPF, endereco, socios, QSA)
          - Processos judiciais
          - Protestos em cartorio
          - Dividas Pefin (PEFIN) e Refin (REFIN)
          - Dados SCR / Open Finance (Banco Central)
          - PEP (PEP) e sancoes (SANCTIONS)
          - Resultado da politica de credito
          
          Use get_report para obter a lista de secoes e seus IDs.
  /report/list:
    get:
      operationId: ReportController_list
      parameters:
        - name: take
          in: query
          required: false
          schema:
            type: integer
          description: Quantidade maxima de registros.
        - name: skip
          in: query
          required: false
          schema:
            type: integer
          description: Offset de paginacao.
        - name: statusValue
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - DENIED
              - ALERT
          description: Status do relatorio.
        - name: document
          in: query
          required: false
          schema:
            type: string
          description: CPF ou CNPJ (apenas numeros).
        - name: userId
          in: query
          required: false
          schema:
            type: string
          description: ID do usuario criador.
        - name: createdAtBetween
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: 'Intervalo [startISO, endISO].'
        - name: productIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: Filtrar por productIds.
        - name: operationResultId
          in: query
          required: false
          schema:
            type: string
          description: ID do resultado de operacao.
        - name: reportIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: IDs especificos de relatorios.
        - name: batchId
          in: query
          required: false
          schema:
            type: string
          description: ID do batch.
      responses:
        200:
          description: Array de relatorios com metadados (sem secoes detalhadas).
      tags:
        - report
      security:
        - authorization: []
      summary: Listar relatorios da organizacao
      description: |
          Lista relatorios com filtros opcionais. Retorna relatorios da organizacao
          autenticada. Analistas de credito veem apenas os proprios relatorios.
          
          Suporta paginacao (take/skip) e filtros por status, documento, usuario, periodo,
          produtos, operacao, batch.
  /report/export/{id}:
    get:
      operationId: ReportController_export
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio a exportar.
      responses:
        200:
          description: 'Objeto { status: "processing", reportId } — o PDF chega via webhook.'
      tags:
        - report
      security:
        - authorization: []
      summary: Exportar relatorio em PDF (assincrono)
      description: |
          Solicita a geracao de PDF de um relatorio. Processamento assincrono:
          retorna imediatamente com status "processing" e o arquivo e entregue via webhook
          quando pronto.
          
          Use quando precisar processar varios relatorios em lote ou quando a latencia nao
          for critica. Para receber o PDF na hora, use export_report_sync.
  /report/export-sync/{id}:
    get:
      operationId: ReportController_exportSync
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio a exportar.
      responses:
        200:
          description: 'Objeto com a URL de download do PDF gerado (assinada, com expiracao).'
      tags:
        - report
      security:
        - authorization: []
      summary: Exportar relatorio em PDF
      description: |
          Exporta um relatorio em PDF e retorna a URL de download na resposta.
          
          O endpoint BLOQUEIA ate a geracao concluir — pode levar ate 6 minutos para
          relatorios completos. Use com timeout adequado do lado do cliente. Sempre
          gera PDF do relatorio completo (todas as secoes).
          
          Pre-requisito: o relatorio precisa estar finalizado (status APPROVED, DENIED
          ou ALERT). Relatorios em PENDING nao podem ser exportados.
  /report/{id}/section/{sectionType}:
    get:
      operationId: ReportController_getReportSection
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio.
        - name: sectionType
          required: true
          in: path
          schema:
            type: string
          description: 'Tipo da secao (ex: BASIC_INFORMATION, PROCESSES, SCR, CREDIT_POLICY).'
      responses:
        200:
          description: Secao com dados detalhados do tipo solicitado.
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar secao especifica do relatorio
      description: |
          Retorna uma secao especifica de um relatorio pelo tipo.
          
          Tipos de secao disponiveis:
          - BASIC_INFORMATION: dados cadastrais, endereco, socios
          - PROCESSES: processos judiciais
          - PROTESTS: protestos em cartorio
          - PEFIN: dividas Pefin
          - REFIN: dividas Refin
          - SCR: dados do Sistema de Informacoes de Credito do Banco Central
          - PEP: Pessoa Politicamente Exposta
          - SANCTIONS: sancoes e listas restritivas
          - CREDIT_POLICY: resultado da avaliacao da politica de credito
          - BALANCE_SHEET: balanco patrimonial estruturado
          - DRE: demonstracao do resultado do exercicio
          - FINANCIAL_INDICATORS: indicadores financeiros calculados
  /report/{id}/financial-tab:
    post:
      operationId: ReportController_financialSection
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio (CNPJ) que vai receber as demonstracoes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: |
                      PDFs do balanco patrimonial e/ou da DRE. Repita o campo `files`
                      para enviar mais de um arquivo. Ate 10 arquivos por chamada,
                      50MB cada, somente PDF.
              required:
                - files
      responses:
        200:
          description: Relatorio atualizado, com as secoes financeiras marcadas como em processamento.
        400:
          description: Nenhum arquivo enviado, arquivo que nao e um PDF valido ou mais de 10 arquivos.
        404:
          description: Relatorio nao encontrado ou de outra organizacao.
        413:
          description: Arquivo maior que 50MB.
      tags:
        - report
      security:
        - authorization: []
      summary: Enviar balanco e DRE
      description: |
          Envia um ou mais PDFs de balanco patrimonial e DRE para um relatorio de CNPJ
          ja existente. A extracao transforma as demonstracoes em dados estruturados
          (balanco, DRE e indicadores) e as disponibiliza como secoes do relatorio.

          A chamada e ASSINCRONA: responde 200 assim que os arquivos sao aceitos e
          enfileirados, sem os dados estruturados. O resultado sai depois em
          GET /report/{id}/section/BALANCE_SHEET (idem DRE e FINANCIAL_INDICATORS).

          Envie apenas as paginas do balanco e da DRE: quanto mais enxuto o PDF,
          mais rapido e barato o processamento.
  /report/{id}/committee:
    post:
      operationId: ReportController_conveneCommittee
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio que vai a comite.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: 'Ignora o cache da deliberacao e reprocessa do zero. Padrao false.'
                  default: false
      responses:
        200:
          description: 'Deliberacao aceita e iniciada: { status: "RUNNING", trigger: "MANUAL" | "RERUN" }.'
        400:
          description: 'Relatorio ainda nao esta pronto para o comite (pareceres ou politica pendentes, ou parecer nao habilitado na politica).'
        404:
          description: Relatorio nao encontrado ou de outra organizacao.
        409:
          description: Ja existe uma deliberacao em andamento para este relatorio.
      tags:
        - report
      security:
        - authorization: []
      summary: Convocar o Comite de Credito IA
      description: |
          Dispara manualmente a deliberacao do Comite de Credito IA sobre um relatorio.

          Use quando a politica esta em "Nao convocar automaticamente" e o comite deve rodar
          sob demanda, ou para reconvocar um relatorio que ja deliberou (DONE), falhou
          (ERROR) ou foi pulado (SKIPPED).

          Pre-requisitos (senao retorna 400):
          - a politica do relatorio habilita o pipeline de parecer;
          - os pareceres por secao ja finalizaram;
          - a politica de credito ja concluiu (quando o relatorio tem politica).

          A chamada e assincrona: o 200 confirma que a deliberacao iniciou, nao que terminou.
          Convocacao manual sempre entra como sugestao e nao altera o status do relatorio,
          mesmo numa politica em "Convocar comite e decisao automatica".
          Para saber o resultado, registre o webhook COMMITTEE_FINISHED ou consulte
          GET /report/{id}/insights.
  /report/{id}/insights:
    get:
      operationId: ReportController_getReportInsights
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio.
        - name: section
          required: false
          in: query
          schema:
            type: string
          description: 'Filtra o parecer de UMA secao (ex: PROCESSES, SCR, BALANCE_SHEET). Sem o parametro, retorna todos os pareceres concluidos.'
      responses:
        200:
          description: 'Envelope com reportId, document, committee { status, decision, result, at } e insights[] (parecer por secao).'
        400:
          description: Valor de section fora da lista de tipos de secao.
        404:
          description: Relatorio nao encontrado ou de outra organizacao.
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar pareceres do relatorio
      description: |
          Leitura enxuta do relatorio: apenas os pareceres de IA por secao (texto, score,
          nivel de risco e destaques) e o resumo da deliberacao do comite. Nao traz os
          payloads pesados de integracao.

          Pensado para consumo barato por agentes de IA e para telas de resumo executivo.
          Tambem serve para verificar se os pareceres ja terminaram antes de convocar o
          comite com POST /report/{id}/committee.

          Só entram no array insights[] as secoes com parecer concluido. Relatorio ainda em
          processamento devolve insights vazio ou parcial e committee.status null.
  /committee/deliberations/{reportId}:
    get:
      operationId: CommitteeController_getDeliberation
      parameters:
        - name: reportId
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio que foi a comite.
      responses:
        200:
          description: 'Deliberacao completa: agentOpinions[], synthesis, finalRecommendation, versoes de prompt e telemetria.'
        404:
          description: Nenhuma deliberacao encontrada para este relatorio.
      tags:
        - committee
      security:
        - authorization: []
      summary: Consultar deliberacao do Comite de Credito IA
      description: |
          Retorna a deliberacao completa e auditavel do Comite de Credito IA para um
          relatorio: o voto individual de cada um dos sete agentes (score, parecer,
          redFlags, positiveFactors, recommendation), a sintese do Presidente (decisao,
          justificativa, condicoes, registro de divergencia, alcada), a versao de prompt
          usada por agente e a telemetria (modelos, tokens, custo, duracao).

          Retorna sempre a deliberacao mais recente. Reconvocacoes (trigger RERUN) geram
          uma nova deliberacao, e e ela que passa a ser devolvida.

          Para o fluxo do dia a dia, GET /report/{id}/insights e mais leve.
  /report/analyze:
    post:
      operationId: ReportController_analyze
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID do relatorio a analisar.
                approved:
                  type: boolean
                  description: 'true para aprovar, false para negar.'
                commentary:
                  type: string
                  description: Comentario do analista (opcional).
              required:
                - id
                - approved
      responses:
        200:
          description: Relatorio atualizado com a analise registrada.
      tags:
        - report
      security:
        - authorization: []
      summary: Analisar relatorio manualmente
      description: |
          Registra uma ANALISE MANUAL de um relatorio por um usuario (ex.: analista de credito).

          O usuario submete uma decisao (approved: true/false) com justificativa
          (commentary). Nao reprocessa nem recoleta dados das fontes — apenas registra
          a decisao humana sobre o relatorio existente. Para refazer uma analise manual
          ja registrada, use re_analyze.
  /report/re-analyze:
    post:
      operationId: ReportController_reAnalyze
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: ID do relatorio a re-analisar.
                approved:
                  type: boolean
                  description: 'true para aprovar, false para negar.'
                commentary:
                  type: string
                  description: Comentario do analista (opcional).
              required:
                - id
                - approved
      responses:
        200:
          description: Relatorio atualizado com a nova analise.
      tags:
        - report
      security:
        - authorization: []
      summary: Refazer analise manual do relatorio
      description: |
          Refaz a ANALISE MANUAL de um relatorio que ja recebeu uma decisao humana
          previa via /report/analyze. Exige permissao do usuario para revisar analises
          manuais ja registradas.

          Nao reprocessa nem recoleta dados das fontes — apenas substitui a decisao
          humana (approved + commentary) anteriormente registrada.
  /credit-policy/policy:
    get:
      operationId: PolicyController_find
      parameters:
        - name: percentages
          required: false
          in: query
          description: Enable percentage of policies
          schema:
            type: boolean
        - name: enabled
          required: false
          in: query
          description: Filtrar por politicas ativas. "true" ou "false" (como string).
          schema:
            type: boolean
        - name: protected
          required: false
          in: query
          description: Incluir politicas protegidas do sistema. "true" ou "false" (como string).
          schema:
            type: boolean
      responses:
        200:
          description: 'Array de politicas com id, name, enabled, documentType, grupos de regras e configuracoes.'
      tags:
        - credit-policy/policy
      security:
        - authorization: []
      summary: Listar politicas de credito
      description: |
          Lista as politicas de credito da organizacao.
          
          Cada politica define:
          - Quais fontes de dados consultar (bureau de credito, SCR/Open Finance, etc.)
          - Regras de aprovacao automatica (score, limites, restricoes)
          - Tipo de relatorio gerado (SIMPLES, ESSENCIAL, COMPLETO, COMPLETO+)
          - Grupos de regras com pesos e thresholds
          
          O policyId retornado e necessario para criar relatorios (create_report).
          
          Filtros opcionais:
          - enabled: true para ver apenas politicas ativas
          - protected: true para incluir politicas protegidas (padrao do sistema)
  /v2/report:
    post:
      operationId: ReportApiController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportDto'
      responses:
        200:
          description: ''
      tags:
        - report
      security:
        - authorization: []
      summary: Criar relatorio (API v2)
      description: |
          Versao v2 da criacao de relatorio. Mesma funcionalidade de create_report
          com payload revisado. Use create_report_v2 para novas integracoes.
  /v2/report/{id}:
    get:
      operationId: ReportApiController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio.
      responses:
        200:
          description: ''
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar relatorio (API v2)
      description: |
          Versao v2 da consulta de relatorio. Retorna o relatorio com estrutura
          atualizada. Use get_report_v2 para novas integracoes.
components:
  securitySchemes:
    authorization:
      scheme: Bearer
      bearerFormat: JWT
      type: apiKey
      name: authorization
      description: Enter JWT token
      in: header
  schemas:
    CreateWebhookDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WebhookTypeEnum'
        url:
          type: string
          description: The URL for the webhook
          example: 'https://webhook-test.com/a0a7aadb8de3e'
        apiKey:
          type: string
          description: API Key para uma requisição autenticada (será enviado como `api-key` em headers)
          example: xxx-xxx-xxx
      required:
        - type
        - url
    WebhookTypeEnum:
      type: string
      description: Type Webhook
      enum:
        - REPORT
        - OPTIN
        - CREDIT_POLICY
        - REPORT_STATUS
        - REPORT_FINISHED
        - REPORT_EXPORTED
        - COMMITTEE_FINISHED
        - OPERATION
    CreateReportDto:
      type: object
      properties:
        policyId:
          type: string
        document:
          type: string
        type:
          type: string
      required:
        - policyId
        - document
        - type