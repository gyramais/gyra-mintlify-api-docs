    post:
      operationId: WebhookController_save
      summary: Criar ou atualizar uma assinatura de webhook
      description: |
          Cria (sem id) ou atualiza (com id) uma assinatura de webhook. A mesma assinatura pode escutar
          eventos do Onboarding e eventos de relatorio e credito.

          Quando os eventos de relatorio e credito nao puderem ser gravados (o endereco precisa responder
          a um POST de teste no momento do cadastro), a resposta continua 200 e traz `warning` com o motivo.
          
          LISTA DE EVENTOS VAZIA QUER DIZER TODOS. Quem esta comecando nao sabe de quais precisa, e
          escolher antes de conhecer produz assinatura errada e evento perdido em silencio.
          
          O segredo e gerado pela plataforma e devolvido UMA VEZ, na criacao. Ele e por assinatura: um
          endpoint comprometido nao permite forjar evento para os outros.
          
          A URL precisa ser publica; endereco interno e recusado, e o nome e resolvido de novo a cada
          tentativa de entrega.
          
          Confira a assinatura com HMAC_SHA256(segredo, "<X-Gyra-Timestamp>.<corpo cru>") e recuse o que
          estiver fora de uma janela de cinco minutos.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWebhookEndpointDto'
            example:
              url: 'https://api.suaempresa.com/gyra/webhook'
              label: 'Produção, esteira de crédito'
              events:
