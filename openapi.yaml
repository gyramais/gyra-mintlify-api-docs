openapi: 3.0.0
info:
  title: GYRA+ API - MCP Server
  description: API da Gyra+ para analise de credito. Spec curada para uso com agentes AI via MCP.
  version: '1.0'
  contact: {}
servers:
  - url: 'https://gyra-core.gyramais.com.br'
    description: Producao
paths:
  /report/{id}/financial-tab:
    post:
      operationId: ReportController_financialSection
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio (CNPJ) que vai receber as demonstracoes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: |
                      PDFs do balanco patrimonial e/ou da DRE. Repita o campo `files`
                      para enviar mais de um arquivo. Ate 10 arquivos por chamada,
                      50MB cada, somente PDF.
              required:
                - files
      responses:
        200:
          description: Relatorio atualizado, com as secoes financeiras marcadas como em processamento.
        400:
          description: Nenhum arquivo enviado, arquivo que nao e um PDF valido ou mais de 10 arquivos.
        404:
          description: Relatorio nao encontrado ou de outra organizacao.
        413:
          description: Arquivo maior que 50MB.
      tags:
        - report
      security:
        - authorization: []
      summary: Enviar balanco e DRE
      description: |
          Envia um ou mais PDFs de balanco patrimonial e DRE para um relatorio de CNPJ
          ja existente. A extracao transforma as demonstracoes em dados estruturados
          (balanco, DRE e indicadores) e as disponibiliza como secoes do relatorio.

          A chamada e ASSINCRONA: responde 200 assim que os arquivos sao aceitos e
          enfileirados, sem os dados estruturados. O resultado sai depois em
          GET /report/{id}/section/BALANCE_SHEET (idem DRE e FINANCIAL_INDICATORS).

          Envie apenas as paginas do balanco e da DRE: quanto mais enxuto o PDF,
          mais rapido e barato o processamento.
  /report/{id}/committee:
    post:
      operationId: ReportController_conveneCommittee
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio que vai a comite.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: 'Ignora o cache da deliberacao e reprocessa do zero. Padrao false.'
                  default: false
      responses:
        200:
          description: 'Deliberacao aceita e iniciada: { status: "RUNNING", trigger: "MANUAL" | "RERUN" }.'
        400:
          description: 'Relatorio ainda nao esta pronto para o comite (pareceres ou politica pendentes, ou parecer nao habilitado na politica).'
        404:
          description: Relatorio nao encontrado ou de outra organizacao.
        409:
          description: Ja existe uma deliberacao em andamento para este relatorio.
      tags:
        - report
      security:
        - authorization: []
      summary: Convocar o Comite de Credito IA
      description: |
          Dispara manualmente a deliberacao do Comite de Credito IA sobre um relatorio.

          Use quando a politica esta em "Nao convocar automaticamente" e o comite deve rodar
          sob demanda, ou para reconvocar um relatorio que ja deliberou (DONE), falhou
          (ERROR) ou foi pulado (SKIPPED).

          Pre-requisitos (senao retorna 400):
          - a politica do relatorio habilita o pipeline de parecer;
          - os pareceres por secao ja finalizaram;
          - a politica de credito ja concluiu (quando o relatorio tem politica).

          A chamada e assincrona: o 200 confirma que a deliberacao iniciou, nao que terminou.
          Convocacao manual sempre entra como sugestao e nao altera o status do relatorio,
          mesmo numa politica em "Convocar comite e decisao automatica".
          Para saber o resultado, registre o webhook COMMITTEE_FINISHED ou consulte
          GET /report/{id}/insights.
  /report/{id}/insights:
    get:
      operationId: ReportController_getReportInsights
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio.
        - name: section
          required: false
          in: query
          schema:
            type: string
          description: 'Filtra o parecer de UMA secao (ex: PROCESSES, SCR, PEFIN). Sem o parametro, retorna todos os pareceres concluidos. Tipo de secao invalido responde 400; secao sem parecer responde insights vazio.'
      responses:
        200:
          description: 'Envelope com reportId, document, committee { status, decision, result, at } e insights[] (parecer por secao).'
        400:
          description: Valor de section fora da lista de tipos de secao.
        404:
          description: Relatorio nao encontrado ou de outra organizacao.
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar pareceres do relatorio
      description: |
          Leitura enxuta do relatorio: apenas os pareceres de IA por secao (texto, score,
          nivel de risco e destaques) e o resumo da deliberacao do comite. Nao traz os
          payloads pesados de integracao.

          Pensado para consumo barato por agentes de IA e para telas de resumo executivo.
          Tambem serve para verificar se os pareceres ja terminaram antes de convocar o
          comite com POST /report/{id}/committee.

          Só entram no array insights[] as secoes com parecer concluido. Relatorio ainda em
          processamento devolve insights vazio ou parcial e committee.status null.
  /committee/deliberations/{reportId}:
    get:
      operationId: CommitteeController_getDeliberation
      parameters:
        - name: reportId
          required: true
          in: path
          schema:
            type: string
          description: ID do relatorio que foi a comite.
      responses:
        200:
          description: 'Deliberacao completa: agentOpinions[], synthesis, finalRecommendation, versoes de prompt e telemetria.'
        404:
          description: Nenhuma deliberacao encontrada para este relatorio.
      tags:
        - committee
      security:
        - authorization: []
      summary: Consultar deliberacao do Comite de Credito IA
      description: |
          Retorna a deliberacao completa e auditavel do Comite de Credito IA para um
          relatorio: o voto individual de cada um dos sete agentes (score, parecer,
          redFlags, positiveFactors, recommendation), a sintese do Presidente (decisao,
          justificativa, condicoes, registro de divergencia, alcada), a versao de prompt
          usada por agente e a telemetria (modelos, tokens, custo, duracao).

          Retorna sempre a deliberacao mais recente. Reconvocacoes (trigger RERUN) geram
          uma nova deliberacao, e e ela que passa a ser devolvida.

          Para o fluxo do dia a dia, GET /report/{id}/insights e mais leve.
  /auth/authenticate:
    post:
      operationId: AuthController_generateAccessToken
      parameters:
        - name: gyra-client-secret
          in: header
          required: true
          description: 'Client Secret da credencial. Gerado no Toolbox em Configuracoes > API & MCP e mostrado uma unica vez.'
          schema:
            type: string
        - name: gyra-client-id
          in: header
          required: true
          description: 'Client ID da credencial. Gerado no Toolbox em Configuracoes > API & MCP.'
          schema:
            type: string
      responses:
        '200':
          description: 'Sessao criada: accessToken (JWT) e expiresAt (24 horas apos a emissao).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  accessToken:
                    type: string
                    description: 'JWT. Vai no header Authorization como `Bearer <token>`.'
                  expiresAt:
                    type: string
                    format: date-time
                    description: Validade de 24 horas. Renove antes de expirar.
                  userId:
                    type: string
                  organizationId:
                    type: string
                  loggedOutAt:
                    type: string
                    nullable: true
                    format: date-time
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: 6612a7f3a1b2c3d400000000
                createdAt: '2026-07-31T13:40:02.118Z'
                updatedAt: '2026-07-31T13:40:02.118Z'
                expiresAt: '2026-08-01T13:40:02.114Z'
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                userId: 6612a7f3b4c5d6e700000000
                loggedOutAt: null
                organizationId: 6612a7f30000000000000001
        '400':
          description: O gyra-client-id nao corresponde a nenhuma credencial (inclusive credencial revogada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: ClientId inválido.
        '401':
          description: O gyra-client-secret nao confere com o client id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: ClientSecret inválido.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
      tags:
        - auth
      summary: Gerar token de acesso JWT
      description: |
          Autentica via client credentials (client-id e client-secret) e retorna um JWT.
          
          Este e o primeiro passo para usar a API. O token retornado deve ser enviado
          no header Authorization de todas as requisicoes subsequentes.
          
          NOTA: No MCP server, a autenticacao e automatica, e este tool e exposto apenas
          para uso manual ou debug. O server gerencia o token internamente.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request POST 'https://gyra-core.gyramais.com.br/auth/authenticate' \
                --header 'gyra-client-id: SEU_CLIENT_ID' \
                --header 'gyra-client-secret: SEU_CLIENT_SECRET'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/auth/authenticate", {
                method: "POST",
                headers: {
                  "gyra-client-id": process.env.GYRA_CLIENT_ID,
                  "gyra-client-secret": process.env.GYRA_CLIENT_SECRET,
                },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.post(
                  "https://gyra-core.gyramais.com.br/auth/authenticate",
                  headers={
                      "gyra-client-id": client_id,
                      "gyra-client-secret": client_secret,
                  },
              )
              
              dados = resposta.json()
  /webhook:
    post:
      operationId: WebhookController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookDto'
            example:
              type: REPORT_FINISHED
              url: 'https://api.suaempresa.com/gyra/webhook'
      responses:
        '200':
          description: 'Webhook criado com id, type, url e organizationId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                  apiKey:
                    type: string
                    nullable: true
                  organizationId:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
              example:
                id: 6612a7f344eb43f000000000
                createdAt: '2026-07-31T13:40:02.118Z'
                updatedAt: '2026-07-31T13:40:02.118Z'
                organizationId: 6612a7f3fa9e086b00000000
                type: REPORT_FINISHED
                url: 'https://api.suaempresa.com/gyra/webhook'
                apiKey: null
        '400':
          description: 'Tipo invalido, url ausente, ou a URL nao respondeu 2xx ao POST de teste feito antes de salvar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: URL de webhook inválida.
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
      tags:
        - webhook
      summary: Criar webhook para notificacoes
      description: |
          Registra uma URL que recebe um POST a cada evento do tipo escolhido. Cada webhook
          escuta um tipo; para varios tipos, cadastre varios webhooks.

          Antes de salvar, a GYRA+ faz um POST de teste na URL com o corpo
          {"message": "Teste de webhook cadastrado com sucesso!"}. Se a URL nao responder 2xx,
          o cadastro e recusado com 400 "URL de webhook inválida.".

          Tipos:
          - REPORT: cada secao do relatorio atualizada (varios disparos por relatorio)
          - REPORT_FINISHED: todas as fontes do relatorio terminaram
          - REPORT_STATUS: decisao gravada no relatorio (manual ou automatica)
          - CREDIT_POLICY: o resultado da politica de credito mudou de status
          - REPORT_EXPORTED: arquivo exportado pronto (ou falha da exportacao)
          - COMMITTEE_FINISHED: o Comite de Credito IA concluiu ou falhou
          - OPERATION: execucao de esteira concluiu com status final
          - OPTIN: fluxo de opt-in

          Envelope de todo evento: { organizationId, webhookType, data }. Se apiKey for
          informada, vai no header api-key. Entrega com falha de rede, 5xx, 408, 425 ou 429
          e tentada de novo ate 3 vezes.

          REPORT, REPORT_FINISHED e COMMITTEE_FINISHED so saem para relatorios criados
          depois do cadastro do webhook.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request POST 'https://gyra-core.gyramais.com.br/webhook' \
                --header 'Authorization: Bearer <token>' \
                --header 'Content-Type: application/json' \
                --data '{"type":"REPORT_FINISHED","url":"https://api.suaempresa.com/gyra/webhook"}'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/webhook", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  "type": "REPORT_FINISHED",
                  "url": "https://api.suaempresa.com/gyra/webhook"
                }),
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.post(
                  "https://gyra-core.gyramais.com.br/webhook",
                  headers={"Authorization": f"Bearer {token}"},
                  json={
                      "type": "REPORT_FINISHED",
                      "url": "https://api.suaempresa.com/gyra/webhook"
                  },
              )
              
              dados = resposta.json()
  /webhook/findBy:
    get:
      operationId: WebhookController_find
      parameters:
        - name: webhookId
          required: false
          in: query
          description: 'ID de um webhook (opcional). Sem este parametro, retorna todos os webhooks da organizacao do token. A resposta e sempre um array.'
          schema:
            example: 664b63037707171ba58cf311
            type: string
      responses:
        '200':
          description: 'Webhook(s) com id, type, url, apiKey e organizationId.'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  description: Um webhook de relatorio e credito.
              example:
                - id: 6612a7f344eb43f000000000
                  createdAt: '2026-06-18T23:48:24.706Z'
                  updatedAt: '2026-06-18T23:48:24.706Z'
                  organizationId: 6612a7f3fa9e086b00000000
                  type: REPORT_FINISHED
                  url: 'https://api.suaempresa.com/gyra/webhook'
                  apiKey: null
        '400':
          description: webhookId enviado vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: id should not be empty
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
      tags:
        - webhook
      summary: Consultar webhooks cadastrados
      description: |
          Busca webhooks cadastrados na organizacao.
          
          Se webhookId for informado, retorna o webhook especifico.
          Caso contrario, retorna todos os webhooks da organizacao autenticada.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request GET 'https://gyra-core.gyramais.com.br/webhook/findBy' \
                --header 'Authorization: Bearer <token>'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/webhook/findBy", {
                method: "GET",
                headers: { Authorization: `Bearer ${token}` },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.get(
                  "https://gyra-core.gyramais.com.br/webhook/findBy",
                  headers={"Authorization": f"Bearer {token}"},
              )
              
              dados = resposta.json()
  /webhook/{id}:
    delete:
      operationId: WebhookController_delete
      parameters:
        - name: id
          required: true
          in: path
          description: ID do webhook a remover.
          schema:
            example: 664b63037707171ba58cf311
            type: string
      responses:
        '200':
          description: O webhook removido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  url:
                    type: string
                  apiKey:
                    type: string
                    nullable: true
                  organizationId:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                id: 6612a7f344eb43f000000000
                createdAt: '2026-07-31T18:02:54.965Z'
                updatedAt: '2026-07-31T18:02:54.965Z'
                organizationId: 6612a7f3fa9e086b00000000
                type: REPORT_FINISHED
                url: 'https://api.suaempresa.com/gyra/webhook'
                apiKey: null
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '404':
          description: Webhook inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 404
                message: 'An operation failed because it depends on one or more records that were required but not found. Record to delete does not exist.'
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
      tags:
        - webhook
      summary: Deletar webhook
      description: Remove um webhook cadastrado. A URL deixa de receber notificacoes imediatamente.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request DELETE 'https://gyra-core.gyramais.com.br/webhook/6612a7f30000000000000001' \
                --header 'Authorization: Bearer <token>'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/webhook/6612a7f30000000000000001", {
                method: "DELETE",
                headers: { Authorization: `Bearer ${token}` },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.delete(
                  "https://gyra-core.gyramais.com.br/webhook/6612a7f30000000000000001",
                  headers={"Authorization": f"Bearer {token}"},
              )
              
              dados = resposta.json()
  /report/section/{id}:
    get:
      operationId: SectionController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: 'ID da secao (ObjectId). Disponivel no array sections[] do relatorio.'
      responses:
        '200':
          description: 'Secao completa com dados detalhados, status de finalizacao e metadados.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: A secao por id. Mesma forma da consulta por tipo.
              example:
                id: 6612a7f3dc5b830500000000
                type:
                  id: 6612a7f3ae223a4700000000
                  value: PROTESTS
                sectionDetails:
                  - values:
                      bureau:
                        protestsQuantity: 15
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para acessar este recurso.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
      tags:
        - report
      security:
        - authorization: []
      summary: Consultar secao por ID
      description: |
          Retorna os dados detalhados de uma secao especifica de um relatorio.
          
          Cada relatorio e composto por varias secoes que contem dados de diferentes fontes:
          - Informacoes basicas (CNPJ/CPF, endereco, socios, QSA)
          - Processos judiciais
          - Protestos em cartorio
          - Dividas Pefin/Refin
          - Dados SCR / Open Finance (Banco Central)
          - PEP e sancoes internacionais
          - Resultado da politica de credito
          
          Use get_report para obter a lista de secoes e seus IDs. Um id que nao
          corresponde a nenhuma secao responde 200 sem corpo.
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request GET 'https://gyra-core.gyramais.com.br/report/section/6612a7f30000000000000001' \
                --header 'Authorization: Bearer <token>'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/report/section/6612a7f30000000000000001", {
                method: "GET",
                headers: { Authorization: `Bearer ${token}` },
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.get(
                  "https://gyra-core.gyramais.com.br/report/section/6612a7f30000000000000001",
                  headers={"Authorization": f"Bearer {token}"},
              )
              
              dados = resposta.json()
  /report:
    post:
      operationId: ReportController_create
      parameters: []
