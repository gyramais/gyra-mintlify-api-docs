  /v1/registry/{id}/documents:
    post:
      operationId: RegistryController_confirmDocument
      summary: Confirmar o upload e disparar a analise
      description: |
          Segundo passo do envio assincrono: confirma o arquivo que ja foi para o armazenamento e
          dispara o pipeline. Responde 202 com o documentId.
          
          O resultado chega por webhook (registry.document.assessed) ou por get_document_status.
          
          Sobre os dois campos de tipo: `expectedType` PEDE um tipo e a conferencia roda; `typeHint`
          AFIRMA o tipo e a classificacao e pulada. Enviando os dois, typeHint vence.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: Id do cadastro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRegistryDocumentDto'
            example:
              key: presigned/contrato-social-3f6c2a9e-8b1d-4c7a-9e2f-5a1b7c3d9e40.pdf
              fileName: contrato-social.pdf
              expectedType: CONTRATO_SOCIAL
              callbackUrl: 'https://api.suaempresa.com/gyra/kyc'
      responses:
        '202':
          description: documentId do documento em processamento (202).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryConfirmResponse'
              example:
                documentId: 6612a7f30000000000000031
                status: RECEIVED
        '400':
          description: 'Corpo invalido (key e fileName sao obrigatorios). A mensagem concatena todas as falhas por virgula.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'key should not be empty,key must be a string'
        '409':
          description: 'O mesmo arquivo (mesmo conteudo) ja esta neste cadastro.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 409
                message: Este arquivo já existe neste cadastro.
        '502':
          description: 'O armazenamento ou o servico de cadastro nao respondeu. Tente de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 502
                message: Não foi possível registrar o documento.
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para acessar este recurso.
        '404':
          description: 'Cadastro inexistente, personDocument que nao e pessoa deste cadastro ("Pessoa não encontrada neste cadastro."), ou modulo Onboarding nao liberado ("Recurso não encontrado.").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 404
                message: Cadastro não encontrado.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
