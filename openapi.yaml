  /v1/collections/{id}/items/{itemId}/review:
    post:
      operationId: CollectionController_review
      summary: Decidir sobre um item em revisao
      description: |
          A decisao do operador sobre um item em AWAITING_OPERATOR, MANUAL_REVIEW, REJECTED, SUBMITTED
          ou PROCESSING. Em outro status, responde 409. Cada item aceita ate 3 pedidos de reenvio;
          depois disso, aprove ou dispense.
          
          Tres saidas:
          - APPROVED: o item fecha;
          - RESEND_REQUESTED: o destinatario recebe o pedido de novo. O comentario e OBRIGATORIO aqui, e
            e ele que o cliente le, entao escreva o que precisa ser corrigido, nao o codigo do check;
          - WAIVED: o item sai do pedido.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: Id da solicitacao.
        - name: itemId
          required: true
          in: path
          schema:
            type: string
          description: Id do item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCollectionItemDto'
            example:
              decision: RESEND_REQUESTED
              comment: O comprovante está no nome de outra pessoa. Envie um no seu nome.
      responses:
        '200':
          description: 'O detalhe da solicitacao inteira, ja com o item no status resultante (mesmo corpo de GET /v1/collections/{id}). APPROVED leva o item a VALIDATED, WAIVED a WAIVED e RESEND_REQUESTED de volta a PENDING, com o comentario em rejectionReason.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
              example:
                id: 6612a7f30000000000000051
                registryId: 6612a7f30000000000000001
                status: IN_PROGRESS
                itemsTotal: 5
                itemsResolved: 3
                itemsAwaitingOperator: 0
                items:
                  - id: 6612a7f30000000000000072
                    collectionId: 6612a7f30000000000000051
                    recipientId: 6612a7f30000000000000061
                    order: 2
                    kind: DOCUMENT
                    documentType: COMPROVANTE_RESIDENCIA
                    label: Comprovante de residência
                    required: true
                    status: PENDING
                    verdict: INVALIDO
                    rejectionReason: O comprovante está no nome de outra pessoa. Envie um no seu nome.
                    resendCount: 1
                    resendRequestedAt: '2026-09-06T10:05:00.000Z'
                    reviewDecision: RESEND_REQUESTED
                    reviewComment: O comprovante está no nome de outra pessoa. Envie um no seu nome.
                    reviewedAt: '2026-09-06T10:05:00.000Z'
                    resolvedAt: null
        '400':
          description: 'Decisao fora da lista, comentario ausente em RESEND_REQUESTED, comentario acima de 500 caracteres ou identificador fora do formato ObjectId.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: Informe o motivo do pedido de reenvio.
        '409':
          description: 'O item nao esta aguardando decisao, ou ja chegou ao limite de reenvios.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 409
                message: Este item não está aguardando decisão.
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
