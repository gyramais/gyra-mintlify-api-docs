  /v1/registry/{id}/documents/{docId}/reprocess:
    post:
      operationId: RegistryController_reprocessDocument
      summary: Reprocessar um documento
      description: |
          Roda o pipeline de novo. Sem `stages`, roda inteiro; com um subconjunto de
          CLASSIFY/EXTRACT/VALIDATE, as etapas de fora reaproveitam a tentativa anterior.
          
          Duas regras que evitam surpresa: pular EXTRACT so funciona quando existe extracao gravada antes,
          e reexecutar EXTRACT sempre revalida. Confira stages.executed e stages.reused no resultado.
          
          `forceType` corrige uma classificacao errada; como afirma o tipo, a conferencia
          EXPECTED_TYPE_MATCH sai SKIP naquela tentativa.
          
          REPROCESSAR NAO COBRA DE NOVO: a cobranca e por documento, nao por tentativa.
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
          description: Id do cadastro.
        - name: docId
          required: true
          in: path
          schema:
            type: string
          description: Id do documento.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessRegistryDocumentDto'
            example:
              stages:
                - VALIDATE
              forceType: ALTERACAO_CONTRATUAL
      responses:
        '202':
          description: 'Confirmacao do reprocessamento (202), com a tentativa nova. O documento volta a RECEIVED.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                  status:
                    type: string
                    description: Sempre RECEIVED nesta resposta.
                  attempt:
                    type: integer
                    description: A tentativa que acabou de comecar.
              example:
                documentId: 6612a7f30000000000000031
                status: RECEIVED
                attempt: 2
        '400':
          description: 'Corpo invalido (etapa fora de CLASSIFY/EXTRACT/VALIDATE, tipo fora da lista, URL invalida) ou identificador fora do formato ObjectId.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 400
                message: 'each value in stages must be one of the following values: CLASSIFY, EXTRACT, VALIDATE'
        '409':
          description: 'Um operador ja decidiu este documento. Mande overrideFeedback true para substituir a decisao pelo parecer novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 409
                message: Este documento já foi decidido por um operador. Reprocessar vai substituir essa decisão pelo novo parecer.
        '429':
          description: 'O documento ja chegou ao limite de 5 tentativas.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 429
                message: Limite de reprocessamentos atingido.
        '401':
          description: 'Token ausente, expirado ou invalido. Gere outro em POST /auth/authenticate.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 401
                message: Token de acesso inválido.
        '403':
          description: O usuario autenticado nao tem a permissao exigida pela rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 403
                message: Você não tem permissão para acessar este recurso.
        '404':
          description: 'Recurso inexistente OU capacidade nao liberada para a organizacao. As duas coisas respondem 404 de proposito: para quem nao tem o modulo, a rota nao existe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 404
                message: Documento não encontrado.
        '502':
          description: 'O servico de cadastro nao respondeu. Tente de novo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 502
                message: Não foi possível reprocessar o documento.
        '500':
          description: 'Falha nossa. Tente de novo; se persistir, acione o suporte com o horario da chamada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: 500
                message: Internal server error
      tags:
        - registry
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
              curl --request POST 'https://gyra-core.gyramais.com.br/v1/registry/6612a7f30000000000000001/documents/6612a7f30000000000000001/reprocess' \
                --header 'Authorization: Bearer <token>' \
                --header 'Content-Type: application/json' \
                --data '{"stages":["VALIDATE"],"forceType":"ALTERACAO_CONTRATUAL"}'
        - lang: JavaScript
          label: Node
          source: |
              const resposta = await fetch("https://gyra-core.gyramais.com.br/v1/registry/6612a7f30000000000000001/documents/6612a7f30000000000000001/reprocess", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  "stages": [
                    "VALIDATE"
                  ],
                  "forceType": "ALTERACAO_CONTRATUAL"
                }),
              });
              
              const dados = await resposta.json();
        - lang: Python
          label: Python
          source: |
              import requests
              
              resposta = requests.post(
                  "https://gyra-core.gyramais.com.br/v1/registry/6612a7f30000000000000001/documents/6612a7f30000000000000001/reprocess",
                  headers={"Authorization": f"Bearer {token}"},
                  json={
                      "stages": [
                          "VALIDATE"
                      ],
                      "forceType": "ALTERACAO_CONTRATUAL"
                  },
              )
              
              dados = resposta.json()
